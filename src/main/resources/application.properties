server.port=${PORT:10000}

# ---------------------------------------------------------------
# DATABASE
# Default = H2 file database so the project runs with zero setup.
# Switch to MySQL by commenting the H2 block and uncommenting MySQL.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# --- MySQL (recommended for your resume demo) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/interviewdb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# GEMINI (free tier)
# Set the key as an environment variable: GEMINI_API_KEY
# ---------------------------------------------------------------
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# ---------------------------------------------------------------
# JWT
# ---------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-at-least-32-chars}
app.jwt.expiry-hours=12

# Interview settings
interview.questions-per-session=5
